[package]
name = "hayro-wasm-bridge"
version = "0.1.0"
edition = "2024"
readme = "README.md"
repository = "https://github.com/infoliage/hayro-wasm-bridge"
license = "Apache-2.0 OR MIT"

# "cdylib" ("C dynamic library") tells cargo to emit a standalone binary with
# a plain exported-function interface, instead of the default "rlib" (which
# only other Rust crates can link against). This is what turns
# `cargo build --target wasm32-unknown-unknown` into an actual loadable
# `.wasm` file.
[lib]
crate-type = ["cdylib"]

[dependencies]
bytemuck = "1.25.2"
# `embed-fonts`/`embed-cmaps` currently happen to be in hayro's own default
# feature set too, but we list them explicitly so text rendering (standard
# 14 fonts + predefined cmaps) keeps working here even if that default ever
# changes upstream.
hayro = { version = "0.7.1", features = ["embed-fonts", "embed-cmaps"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
